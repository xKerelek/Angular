<li class="list-group-item">
      <input
      type="checkbox"
      class="form-check-input my-1"
      [checked]="todo.isComplete"
      (change)="changeToDoStatus(todo)"
      >
      <span class="todo-item" [ngClass]="{'text-decoration-line-through': todo.isComplete}">{{i + 1}}. {{todo.name}}</span>
      <button class="btn btn-danger btn-sm mx-2" type="button" (click)="toggleModal()">Usuń</button>
      <button class="btn btn-info btn-sm mx-2" type="button" (click)="navigateToDetails()">Szczegóły</button>
    </li>

    <app-modal *ngIf="openModal" (close)="toggleModal()" [title]="'Czy na pewno chcesz usunąć zadanie o numerze ' + (i + 1) + '?'">
      <div class="d-flex justify-content-end">
        <button class="btn btn-info btn-sm" type="button" (click)="toggleModal()">Anuluj</button>
        <button class="btn btn-danger btn-sm mx-2" type="button" (click)="deleteTodo()">Usuń</button>
      </div>
    </app-modal>
