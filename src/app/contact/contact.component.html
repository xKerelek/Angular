<div class="flex justify-center">
  <input type="text" [(ngModel)]="searchText" placeholder="Search contact..." class="border p-2 rounded-lg">
</div>

<div class="flex flex-row gap-10 justify-center mt-10">
  <div *ngFor="let contact of filteredContacts" class="bg-gray-300 p-5 rounded-lg mb-5 w-1/3">
      <p>
        <span class="text-blue-500 font-bold">First name:</span> {{contact.firstName}}
      </p>
      <p>
        <span class="text-orange-500 font-bold">Last name:</span> {{contact.lastName}}
      </p>
      <p *ngIf="editContacts !== contact.id">
        <span class="text-purple-500 font-bold">Phone number:</span> {{contact.phoneNumber}}
      </p>
    <div *ngIf="editContacts === contact.id" class="flex items-center gap-2 mb-2">
      <span class="text-purple-500 font-bold">Phone:</span>
      <input type="number" [(ngModel)]="contact.phoneNumber" class="border border-purple-300 p-1 rounded-md w-full focus:outline-purple-500">
    </div>
      <p *ngIf="editContacts !== contact.id">
        <span class="text-pink-500 font-bold">E-mail:</span> {{contact.email}}
      </p>
    <div *ngIf="editContacts === contact.id" class="flex items-center gap-2 mb-2">
      <span class="text-pink-500 font-bold">E-mail:</span>
      <input type="email" [(ngModel)]="contact.email" class="border border-pink-300 p-1 rounded-md w-full focus:outline-pink-500">
    </div>
      <p>
        <span class="text-yellow-500 font-bold">Status: </span>
        <span [ngClass]="{'text-green-500': contact.isAvailable, 'text-red-500': !contact.isAvailable}">{{contact.isAvailable ? 'Available' : 'Not available'}}</span>
      </p>
    <div class="flex justify-between mt-5" *ngIf="editContacts !== contact.id">
      <button type="button" class="bg-blue-200 p-2 rounded-lg text-blue-500 cursor-pointer" (click)="onChangeStatus(contact)">Status</button>
      <button type="button" class="bg-amber-200 p-2 rounded-lg text-amber-600 cursor-pointer font-bold" (click)="startEdit(contact)">Edit</button>
      <button type="button" class="bg-red-200 p-2 rounded-lg text-red-500 cursor-pointer" (click)="onDelete(contact)">Delete</button>
    </div>

    <div class="flex justify-between mt-5" *ngIf="editContacts === contact.id">
      <button type="button" class="bg-gray-400 p-2 px-4 rounded-lg text-white cursor-pointer font-bold hover:bg-gray-500" (click)="cancelEdit()">Cancel</button>
      <button type="button" class="bg-green-500 p-2 px-4 rounded-lg text-white cursor-pointer font-bold hover:bg-green-600" (click)="saveEdit(contact)">Save</button>
    </div>
    </div>
</div>

<div class="flex justify-center"  *ngIf="!isFormOpen">
  <button type="button" class="bg-amber-300 p-3 rounded-2xl text-amber-600 font-bold cursor-pointer" (click)="toggleModal()">Show form</button>
</div>
<div class="flex justify-center"  *ngIf="isFormOpen">
  <button type="button" class="bg-orange-300 p-3 rounded-2xl text-orange-600 font-bold cursor-pointer" (click)="toggleModal()">Close form</button>
</div>
<app-add-contact *ngIf="isFormOpen" (addContactEvent)="onAddContact($event)"></app-add-contact>
