<div class="flex justify-center mt-6 px-4">
  <input type="text" [(ngModel)]="searchText" placeholder="Search contact..."
         class="w-full max-w-md border border-slate-300 p-3 rounded-xl shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-400 transition-shadow">
</div>

<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 max-w-7xl mx-auto mt-8 px-4 mb-10">

  <div *ngFor="let contact of filteredContacts" class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 hover:shadow-md transition-shadow flex flex-col justify-between">

    <div>
      <p class="mb-2 text-slate-700">
        <span class="text-blue-500 font-bold mr-2">First name:</span> {{contact.firstName}}
      </p>
      <p class="mb-2 text-slate-700">
        <span class="text-orange-500 font-bold mr-2">Last name:</span> {{contact.lastName}}
      </p>

      <p *ngIf="editContacts !== contact.id" class="mb-2 text-slate-700">
        <span class="text-purple-500 font-bold mr-2">Phone number:</span> {{contact.phoneNumber}}
      </p>
      <div *ngIf="editContacts === contact.id" class="flex items-center gap-2 mb-3 mt-1">
        <span class="text-purple-500 font-bold">Phone:</span>
        <input type="number" [(ngModel)]="contact.phoneNumber" class="border border-purple-300 p-2 rounded-lg w-full focus:outline-none focus:ring-2 focus:ring-purple-400 bg-purple-50">
      </div>

      <p *ngIf="editContacts !== contact.id" class="mb-2 text-slate-700">
        <span class="text-pink-500 font-bold mr-2">E-mail:</span> {{contact.email}}
      </p>
      <div *ngIf="editContacts === contact.id" class="flex items-center gap-2 mb-3 mt-1">
        <span class="text-pink-500 font-bold">E-mail:</span>
        <input type="email" [(ngModel)]="contact.email" class="border border-pink-300 p-2 rounded-lg w-full focus:outline-none focus:ring-2 focus:ring-pink-400 bg-pink-50">
      </div>

      <p class="mb-5 text-slate-700 flex items-center gap-2">
        <span class="text-yellow-500 font-bold">Status: </span>
        <span class="px-3 py-1 rounded-full text-sm font-bold"
              [ngClass]="{'bg-green-100 text-green-700': contact.isAvailable, 'bg-red-100 text-red-700': !contact.isAvailable}">
          {{contact.isAvailable ? 'Available' : 'Not available'}}
        </span>
      </p>
    </div>

    <div class="flex justify-between gap-3 border-t border-slate-100 pt-4" *ngIf="editContacts !== contact.id">
      <button type="button" class="flex-1 bg-blue-50 hover:bg-blue-100 text-blue-600 font-semibold p-2 rounded-lg transition-colors" (click)="onChangeStatus(contact)">Status</button>
      <button type="button" class="flex-1 bg-amber-50 hover:bg-amber-100 text-amber-600 font-semibold p-2 rounded-lg transition-colors" (click)="startEdit(contact)">Edit</button>
      <button type="button" class="flex-1 bg-red-50 hover:bg-red-100 text-red-600 font-semibold p-2 rounded-lg transition-colors" (click)="onDelete(contact)">Delete</button>
    </div>

    <div class="flex justify-between gap-3 border-t border-slate-100 pt-4" *ngIf="editContacts === contact.id">
      <button type="button" class="flex-1 bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold p-2 rounded-lg transition-colors" (click)="cancelEdit()">Cancel</button>
      <button type="button" class="flex-1 bg-green-500 hover:bg-green-600 text-white font-bold p-2 rounded-lg transition-colors" (click)="saveEdit(contact)">Save</button>
    </div>

  </div>
</div>

<div class="flex justify-center mb-10">
  <button *ngIf="!isFormOpen" type="button" class="bg-amber-400 hover:bg-amber-500 text-white shadow-md p-3 px-8 rounded-full font-bold transition-colors" (click)="toggleModal()">Show form</button>
  <button *ngIf="isFormOpen" type="button" class="bg-slate-700 hover:bg-slate-800 text-white shadow-md p-3 px-8 rounded-full font-bold transition-colors" (click)="toggleModal()">Close form</button>
</div>

<app-add-contact *ngIf="isFormOpen" (addContactEvent)="onAddContact($event)"></app-add-contact>
